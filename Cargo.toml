[workspace]
resolver = "2"
members = [
    "crates/phlo-transform-sql",
    "crates/phlo-transform-core",
    "crates/phlo-transform-engine",
    "crates/phlo-transform-trino",
    "crates/phlo-transform-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/phlohouse/phlo-transform"
rust-version = "1.93"

[workspace.dependencies]
# Internal crates.
phlo-transform-core = { path = "crates/phlo-transform-core", version = "0.0.0" }
phlo-transform-engine = { path = "crates/phlo-transform-engine", version = "0.0.0" }
phlo-transform-sql = { path = "crates/phlo-transform-sql", version = "0.0.0" }
phlo-transform-trino = { path = "crates/phlo-transform-trino", version = "0.0.0" }

# External crates.
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
petgraph = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
lto = "thin"
