[workspace]
resolver = "2"
members = [
    "crates/phlo-transform-sql",
    "crates/phlo-transform-core",
    "crates/phlo-transform-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/phlohouse/phlo-transform"
rust-version = "1.93"

[workspace.dependencies]
# Internal crates.
phlo-transform-core = { path = "crates/phlo-transform-core", version = "0.0.0" }
phlo-transform-sql = { path = "crates/phlo-transform-sql", version = "0.0.0" }

# External crates.
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2"
toml = "1"
walkdir = "2"

[profile.release]
lto = "thin"
