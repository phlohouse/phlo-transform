name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    services:
      # Shared-state backend: the Postgres `StateStore` integration test
      # runs against this service via PHLO_TEST_POSTGRES_URL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phlo
          POSTGRES_PASSWORD: phlo
          POSTGRES_DB: phlo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phlo -d phlo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PHLO_TEST_POSTGRES_URL: postgres://phlo:phlo@localhost:5432/phlo_test
    steps:
      - uses: actions/checkout@v4

      # libduckdb-sys compiles a multi-GB static library; the default
      # runner disk is too small without reclaiming preinstalled tooling.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      # Install the toolchain pinned in .mise.toml (Rust 1.93 + rustfmt/clippy).
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Docker is available on GitHub-hosted Ubuntu runners.
      - name: Trino integration tests
        run: cargo test -p phlo-transform-trino --test trino_e2e -- --ignored

      - name: Nessie WAP integration tests
        run: cargo test -p phlo-transform-trino --test nessie_wap_e2e -- --ignored

      - name: Daemon environment-isolation integration test
        run: cargo test -p phlo-transform-daemon --test nessie_e2e -- --ignored

      - name: Incremental MERGE integration tests
        run: cargo test -p phlo-transform-trino --test trino_incremental_e2e -- --ignored

      - name: CLI golden-path integration test
        run: cargo test -p phlo-transform-cli --test golden_path -- --ignored
