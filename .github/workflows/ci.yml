name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the toolchain pinned in .mise.toml (Rust 1.93 + rustfmt/clippy).
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Docker is available on GitHub-hosted Ubuntu runners.
      - name: Trino integration tests
        run: cargo test -p phlo-transform-trino --test trino_e2e -- --ignored
