name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: phlo-transform
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: phlo-transform
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: phlo-transform
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: phlo-transform
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: phlo-transform.exe
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /

      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      # The bundled DuckDB C++ build is heavy; release builds take a while.
      - name: Build
        run: cargo build --release --locked -p phlo-transform-cli --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          name=phlo-transform-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist && tar -czf "$name.tar.gz" "$name"
          python - "$name.tar.gz" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_suffix(archive.suffix + ".sha256").write_text(
              f"{digest}  {archive.name}\n"
          )
          PY
          echo "artifact=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phlo-transform-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.artifact }}
            dist/${{ steps.package.outputs.artifact }}.sha256

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phlo-transform-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          generate_release_notes: true
