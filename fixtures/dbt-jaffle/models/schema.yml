version: 2

sources:
  - name: raw
    database: warehouse
    schema: raw_lims
    tables:
      - name: customers
        identifier: raw_customers
        description: LIMS customer export
      - name: orders
        columns:
          - name: id
            tests: [unique, not_null]
          - name: status
            tests:
              - accepted_values:
                  values: ['placed', 'shipped', 'cancelled']

models:
  - name: customers
    description: Customer mart with order counts
    meta:
      owner: analytics
    tests:
      - dbt_utils.expression_is_true:
          expression: "customer_id >= 0"
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: orders_incremental
    columns:
      - name: order_id
        tests: [unique, not_null]
