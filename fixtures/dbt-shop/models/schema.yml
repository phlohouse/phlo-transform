version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: customers
      - name: orders
        columns:
          - name: id
            tests: [unique, not_null]

models:
  - name: stg_orders
    description: Cleaned orders with a default region applied
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'cancelled', 'returned']
  - name: customer_orders
    description: Per-customer order totals
    meta:
      owner: analytics
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: orders_incremental
    columns:
      - name: order_id
        tests: [unique, not_null]
  - name: daily_revenue
    columns:
      - name: ordered_at
        tests: [not_null]
